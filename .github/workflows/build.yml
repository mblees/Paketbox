name: Build

on:
  push:
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PlatformIO Project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('PlatformIO Project/platformio.ini') }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build firmware (Heltec WiFi LoRa 32 V2)
        run: |
          cp keyfiles/lorawan-keys_example.h keyfiles/lorawan-keys.h
          pio run

  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r "Python Service/requirements.txt"

      - name: Check service
        run: python -m py_compile "Python Service/main.py"
